<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mode Icons Preview</title>
<style>
  :root {
    --bg: #0f0c08; --bg-elevated: #17120d; --bg-elevated-2: #221a12;
    --text: #f4ead8; --text-dim: #b7a68d; --border: rgba(255,255,255,0.08); --primary: #e2933f;
  }
  :root[data-theme="light"] {
    --bg: #f7f1e4; --bg-elevated: #fffbf3; --bg-elevated-2: #efe6d3;
    --text: #2b2416; --text-dim: #7a6f57; --border: rgba(0,0,0,0.08); --primary: #c8741f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 16px; }
  .wrap { max-width: 980px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0.4rem 0 0.2rem; }
  p.sub { color: var(--text-dim); margin: 0 0 1rem; font-size: 0.9rem; }
  .controls { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.2rem; }
  .controls button { background: var(--bg-elevated); color: var(--text); border: 1px solid var(--border); border-radius: 999px; padding: 0.4rem 0.9rem; font: inherit; font-size: 0.85rem; cursor: pointer; }
  .controls button.on { background: var(--primary); color: #1a1209; border-color: transparent; font-weight: 700; }
  .cols { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 24px; align-items: start; }
  @media (max-width: 760px) { .cols { grid-template-columns: 1fr; } }
  .label { font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-dim); margin: 1rem 0 0.4rem; font-weight: 700; }
  .list { background: var(--bg-elevated); border-radius: 14px; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 0.8rem; padding: 0.7rem 1rem; border-bottom: 1px solid var(--border); }
  .row:last-child { border-bottom: none; }
  .tile { flex-shrink: 0; width: 2.6rem; height: 2.6rem; border-radius: 10px; background: var(--bg-elevated-2); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; color: var(--primary); }
  .tile svg { width: 22px; height: 22px; }
  .emoji { width: 1.6rem; text-align: center; font-size: 1.1rem; opacity: 0.55; }
  .title { font-weight: 700; font-size: 0.95rem; }
  .tag { color: var(--text-dim); font-size: 0.78rem; }
  .row.weak .title::after { content: " · weakest"; color: #d9785a; font-weight: 600; font-size: 0.72rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; }
  .cell { background: var(--bg-elevated); border-radius: 14px; padding: 14px 6px 10px; text-align: center; color: var(--text); }
  .cell svg { width: 48px; height: 48px; display: block; margin: 0 auto 8px; }
  .cell span { font-size: 0.72rem; color: var(--text-dim); }
  .cell.weak { outline: 1px dashed #d9785a; }
  body.mono .tile { color: var(--text); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Mode icons: stroke preview</h1>
  <p class="sub">Left: the Explore Modes list at real size, with the current emoji faded beside each row. Right: the same icons at 48px so you can judge the drawing. Icons marked with a dashed outline are the ones I'm least confident read clearly.</p>
  <div class="controls">
    <button id="t-dark" class="on">Dark</button>
    <button id="t-light">Light</button>
    <button id="t-accent" class="on">Orange tiles</button>
    <button id="t-mono">Neutral tiles</button>
  </div>
  <div class="cols">
    <div id="list"></div>
    <div><div class="label">48px</div><div id="grid" class="grid"></div></div>
  </div>
</div>
<script>
const S = (body) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${body}</svg>`;
const DOT = (x, y) => `<circle cx="${x}" cy="${y}" r="1.25" fill="currentColor" stroke="none"/>`;
const ICONS = {
  // Pushup: diagonal body, straight arm, floor.
  classic: S('<circle cx="4.5" cy="8.5" r="2"/><path d="M7 10.5 21 15"/><path d="M8.5 11v6.5"/><path d="M3 18h19"/>'),
  countdown: S('<circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4l2.5 2"/><path d="M10 2.5h4"/><path d="M12 2.5V6"/>'),
  cards: S('<rect x="9" y="3" width="11" height="15" rx="2"/><path d="M6.2 6.5 4.1 17.4a2 2 0 0 0 1.6 2.3l7.4 1.4"/>'),
  dice: S('<rect x="3.5" y="3.5" width="17" height="17" rx="3.5"/>' + DOT(8.5, 8.5) + DOT(12, 12) + DOT(15.5, 15.5)),
  // Forearm plank: flat body, bent arm on the floor.
  plank: S('<circle cx="4.5" cy="9.5" r="2"/><path d="M7 11.5l14 4"/><path d="M8.5 12 7.5 18h4.5"/><path d="M3 18h19"/>'),
  squat: S('<circle cx="11" cy="3.8" r="2"/><path d="M11 6.5 9.5 12h6.5l-1 8"/><path d="M10.5 8.5H18"/><path d="M5 20.5h15"/>'),
  pullup: S('<path d="M2.5 3h19"/><path d="M7 3l3 8"/><path d="M17 3l-3 8"/><circle cx="12" cy="8.3" r="2"/><path d="M12 10.5V16"/><path d="m12 16-2 5"/><path d="m12 16 2 5"/>'),
  situp: S('<circle cx="5.5" cy="9.5" r="2"/><path d="M7.3 12 12 17.5 16 11.5l4 6"/><path d="M3 20.5h18"/>'),
  // Holland: windmill.
  holland: S('<path d="M9.5 21 11 11.5h2l1.5 9.5"/><path d="M7 21h10"/><path d="M5.5 3.5 18.5 15"/><path d="M18.5 3.5 5.5 15"/>' + DOT(12, 9.2)),
  chainofpain: S('<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>'),
  ladder: S('<path d="M7 2.5v19"/><path d="M17 2.5v19"/><path d="M7 7h10"/><path d="M7 12h10"/><path d="M7 17h10"/>'),
  // Folded cookie with a fortune slip poking out.
  fortune: S('<path d="M2.5 13C3 8 7 5 12 5s9 3 9.5 8c-.4 2-2.5 3.2-4.6 2.6L12 19l-4.9-3.4C5 16.2 2.9 15 2.5 13Z"/><path d="M12 19c-.6-3.3-2.4-5.6-5-6.6"/><path d="m15.5 16.6 5.5 2.6-.9 1.8-5.7-2.7"/>'),
  chase: S('<path d="M3 7.5 5.5 17h13L21 7.5l-5 4.5L12 5l-4 7Z"/><path d="M5.5 20.5h13"/>'),
  poker: S('<path d="M12 3c-2.7 3.6-7.5 5.8-7.5 9.7a3.8 3.8 0 0 0 6.6 2.5"/><path d="M12 3c2.7 3.6 7.5 5.8 7.5 9.7a3.8 3.8 0 0 1-6.6 2.5"/><path d="m12 13.5-1.8 7.5h3.6Z"/>'),
  wheel: S('<circle cx="12" cy="13" r="8.5"/><circle cx="12" cy="13" r="1.8"/><path d="M12 4.5v6.7"/><path d="M12 14.8v6.7"/><path d="M3.5 13h6.7"/><path d="M13.8 13h6.7"/><path d="m10 1.5 2 3 2-3Z"/>'),
  boss: S('<path d="M14.5 17.5 3 6V3h3l11.5 11.5"/><path d="m13 19 6-6"/><path d="m16 16 4 4"/><path d="m19 21 2-2"/><path d="M14.5 6.5 18 3h3v3l-3.5 3.5"/><path d="m5 14 4 4"/><path d="m7 17-3 3"/><path d="m3 19 2 2"/>'),
  sharpshooter: S('<circle cx="12" cy="12" r="8"/><path d="M12 2v5"/><path d="M12 17v5"/><path d="M2 12h5"/><path d="M17 12h5"/>' + DOT(12, 12)),
  pyramid: S('<path d="M12 3 22 20H2Z"/><path d="M5.5 14h13"/><path d="M8.5 9h7"/>'),
  pulse: S('<path d="M2 12h4l2.5-6 4 13 3-9 1.5 2H22"/>'),
  // Rooster: comb, beak, wattle, round body, sweeping tail, legs.
  cock: S('<path d="M8 4.8c-.2-1.3 1.2-2 2-1 .5-1 2.1-.7 2 .6"/><path d="M8.2 9.6V7a2.2 2.2 0 0 1 4.4 0v3.5c2 .9 4 .6 5.6-1.4"/><path d="M8.2 6.6 6 7.6l2.2 1"/><path d="M8.2 9.6c-.8 3.4.5 6.9 4.3 7.6 4 .7 7.6-2.4 7.3-7.7-.1-1.6-.6-3-1.4-4.2"/><path d="M18.4 5.3c-1.2 1.6-2.7 2.5-4.4 2.8"/><path d="m11.5 17.2-.8 3.8"/><path d="m14.5 17.2.6 3.8"/>'),
  zen: S('<path d="M12 20c-2.4-2-3.5-4.8-3.5-7.8S9.8 6.2 12 4c2.2 2.2 3.5 5.2 3.5 8.2S14.4 18 12 20Z"/><path d="M12 20c-3.8 0-7.3-2.3-8.7-6.3 2.6-.6 4.8-.1 6.3 1.2"/><path d="M12 20c3.8 0 7.3-2.3 8.7-6.3-2.6-.6-4.8-.1-6.3 1.2"/>'),
  // Horse: chess-knight silhouette.
  horse: S('<path d="M7 21h11"/><path d="M8.5 21c0-3.5 1-5.8 3.3-7.8-1.8.2-3.5.9-4.7 2.1L5 13.4c.7-3.5 2.9-6.6 6-8.4l.8-2 1.5 2c3.5 1.4 5.2 5 5.2 9.2V21"/>' + DOT(11.5, 8.3)),
  // Tug of war: rope pulled both ways with a centre flag.
  tow: S('<path d="M2.5 12h19"/><path d="m5.5 9-3 3 3 3"/><path d="m18.5 9 3 3-3 3"/><path d="M12 12v6.5"/><path d="M12 12.5h3.5L14.5 14l1 1.5H12"/>'),
  "kb-five-alive": S('<path d="M18 11V6a1.5 1.5 0 0 0-3 0"/><path d="M15 10V4.5a1.5 1.5 0 0 0-3 0V10"/><path d="M12 10V5.5a1.5 1.5 0 0 0-3 0V12"/><path d="M9 12V8.5a1.5 1.5 0 0 0-3 0V14a7 7 0 0 0 7 7h.5a6.5 6.5 0 0 0 4.5-1.8c1-1 1.6-2.4 2-3.7l1.3-4.2a1.5 1.5 0 0 0-2.8-1L18 13"/>'),
  "kb-throne-room": S('<path d="M7 11V4a1.5 1.5 0 0 1 1.5-1.5h7A1.5 1.5 0 0 1 17 4v7"/><path d="M5 11h14v4H5Z"/><path d="M6.5 15v6"/><path d="M17.5 15v6"/><path d="M5 11V9"/><path d="M19 11V9"/>'),
  "kb-core-ten": S('<path d="M8.5 9.5V8a3.5 3.5 0 0 1 7 0v1.5"/><path d="M7.5 9.5h9c1.6 1.4 2.5 3.5 2.5 5.7 0 2.3-1 4.3-2.6 5.8H7.6C6 19.5 5 17.5 5 15.2c0-2.2.9-4.3 2.5-5.7Z"/><path d="M10 13v5"/><circle cx="13.6" cy="15.5" r="1.6"/>'),
};
const MODES = [
  ["pushups", "classic", "💪", "Classic", "Straight sets, no gimmicks"],
  ["pushups", "countdown", "⏱️", "Countdown", "Beat your own personal best"],
  ["pushups", "cards", "🃏", "Cards", "Flip a card, match the move"],
  ["pushups", "dice", "🎲", "Dice roll", "Hit the number before next roll"],
  ["pushups", "ladder", "🪜", "Ladder", "Climb the ladder, cash out anytime"],
  ["pushups", "fortune", "🥠", "Fortune cookie", "One set, one revealed challenge", true],
  ["pushups", "chase", "👑", "Chase the leader", "Hunt the first board you don't already lead"],
  ["pushups", "poker", "♠️", "Poker hands", "Clear five cards, reveal your hand"],
  ["pushups", "wheel", "🎯", "Wheel of pain", "Spin every set for your next number"],
  ["pushups", "boss", "⚔️", "Boss battle", "Take on tougher bosses"],
  ["pushups", "sharpshooter", "🏹", "Sharpshooter", "Destroy targets, one shot at a time"],
  ["pushups", "pyramid", "🔺", "Pyramid", "Descend the base, conquer the apex"],
  ["pushups", "pulse", "❤️‍🔥", "Pulse", "Hold your pace, not your reps"],
  ["pushups", "cock", "🐓", "Cock Mode", "Outpace the cock before it outpaces you", true],
  ["pushups", "zen", "🧘", "Zen Mode", "No counters, no noise — just push"],
  ["pushups", "horse", "🐴", "Horse", "Beat the set before you, or take a letter", true],
  ["pushups", "tow", "🪢", "Tug of war", "Two teams race to the target, together"],
  ["other", "plank", "🪵", "Plank", "Hold your ground, beat your own time"],
  ["other", "squat", "🦵", "Squat", "Camera-counted squats, own your reps"],
  ["other", "pullup", "💪", "Pull-ups", "Camera-counted pull-ups, own your reps"],
  ["other", "situp", "🙇", "Crunch", "Camera-counted crunches, own your reps", true],
  ["other", "holland", "🇳🇱", "Holland Mode", "Pull-ups, pushups, squats — nonstop"],
  ["other", "chainofpain", "⛓️", "Chain of Pain", "Squats, pushups, planks — nonstop"],
  ["kettlebell", "kb-five-alive", "🖐️", "Five Alive", "Kettlebell preset"],
  ["kettlebell", "kb-throne-room", "👑", "Throne Room", "Kettlebell preset"],
  ["kettlebell", "kb-core-ten", "🔟", "Core Ten", "Kettlebell preset"],
];
const SECTIONS = { pushups: "Pushups", other: "Other exercises", kettlebell: "Kettlebell" };
let html = "", last = null;
for (const [sec, id, emoji, title, tag, weak] of MODES) {
  if (sec !== last) { if (last) html += "</div>"; html += `<div class="label">${SECTIONS[sec]}</div><div class="list">`; last = sec; }
  html += `<div class="row${weak ? " weak" : ""}"><span class="emoji">${emoji}</span><div class="tile">${ICONS[id]}</div><div><div class="title">${title}</div><div class="tag">${tag}</div></div></div>`;
}
document.getElementById("list").innerHTML = html + "</div>";
document.getElementById("grid").innerHTML = MODES.map(([, id, , title, , weak]) => `<div class="cell${weak ? " weak" : ""}">${ICONS[id]}<span>${title}</span></div>`).join("");
const btn = (id, fn) => document.getElementById(id).addEventListener("click", fn);
const pair = (a, b, on) => { document.getElementById(a).classList.toggle("on", on); document.getElementById(b).classList.toggle("on", !on); };
btn("t-dark", () => { document.documentElement.removeAttribute("data-theme"); pair("t-dark", "t-light", true); });
btn("t-light", () => { document.documentElement.setAttribute("data-theme", "light"); pair("t-dark", "t-light", false); });
btn("t-accent", () => { document.body.classList.remove("mono"); pair("t-accent", "t-mono", true); });
btn("t-mono", () => { document.body.classList.add("mono"); pair("t-accent", "t-mono", false); });
</script>
</body>
</html>
