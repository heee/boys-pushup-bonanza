# Deploy config used by .github/workflows/deploy-worker.yml (runs wrangler on
# GitHub's Linux runners on every push that touches worker/). Pasting index.js
# into the Cloudflare dashboard's Quick Edit still works as a fallback.
name = "boys-pushup-bonanza-worker"
main = "index.js"
compatibility_date = "2026-08-05"
# Keep any plain-text variables added in the dashboard instead of replacing
# them with only the [vars] below on each deploy (see .github/workflows/deploy-worker.yml).
keep_vars = true

[[d1_databases]]
binding = "DB"
database_name = "boys-pushup-bonanza"
database_id = "28f3fd64-4b28-4238-a19e-8571b0076419"
migrations_dir = "migrations"

# Non-secret variables — set these here or in the dashboard under
# Settings -> Variables and Secrets.
[vars]
ALLOWED_ORIGIN = "https://heee.github.io"

# Secrets (APP_KEY, GEOAPIFY_API_KEY) are NOT set here — run:
#   wrangler secret put APP_KEY
#   wrangler secret put GEOAPIFY_API_KEY
